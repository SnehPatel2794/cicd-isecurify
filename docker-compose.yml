# iSecurify GRC — single-server deployment. Total memory limits ~3.3 GB of 8 GB; the rest is page cache and headroom.
name: isecurify-grc
x-hardening: &hardening
  security_opt: [ "no-new-privileges:true" ]
  cap_drop: [ ALL ]
  init: true
x-readonly: &readonly          # the container's own filesystem is read-only; the only writable places are /tmp (memory) and the named volumes
  read_only: true
  tmpfs: [ "/tmp:size=64m,mode=1777,noexec,nosuid" ]
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      MYSQL_DATABASE: grc
    command: ["--log-bin-trust-function-creators=1","--character-set-server=utf8mb4","--collation-server=utf8mb4_0900_ai_ci","--default-time-zone=+00:00","--innodb-buffer-pool-size=1G","--max-connections=60","--slow-query-log=1","--long-query-time=1"]
    volumes: [ "mysql_data:/var/lib/mysql" ]
    healthcheck: { test: ["CMD-SHELL","mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"], interval: 10s, timeout: 5s, retries: 12, start_period: 30s }
    deploy: { resources: { limits: { memory: 2g } } }
    logging: *logging
  bootstrap:                  # one-shot, the ONLY step that uses the database root account at deploy time: creates the least-privilege migrator account
    <<: [ *hardening, *readonly ]
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["npm","run","db:bootstrap"]
    depends_on: { mysql: { condition: service_healthy } }
    restart: "no"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      ROOT_DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/grc
      DB_NAME: grc
      MIGRATOR_DB_USER: grc_migrator
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?set in .env}
    logging: *logging
  init:                       # one-shot: migrations + least-privilege DB accounts, run as the migrator (not root). Re-runs safely on every deploy.
    <<: [ *hardening, *readonly ]
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["npm","run","db:setup"]
    depends_on: { bootstrap: { condition: service_completed_successfully } }
    restart: "no"
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      ADMIN_DATABASE_URL: mysql://grc_migrator:${MIGRATOR_DB_PASSWORD:?set in .env}@mysql:3306/grc
      DB_NAME: grc
      APP_DB_USER: grc_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      WORKER_DB_USER: grc_worker
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set in .env}
      PURGE_DB_USER: grc_purge
      PURGE_DB_PASSWORD: ${PURGE_DB_PASSWORD:-}
    logging: *logging
  api:
    <<: [ *hardening, *readonly ]
    stop_grace_period: 30s
    build: { context: ., dockerfile: api/Dockerfile }
    restart: unless-stopped
    depends_on: { init: { condition: service_completed_successfully } }
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DATABASE_URL: mysql://grc_app:${APP_DB_PASSWORD}@mysql:3306/grc
      PURGE_DATABASE_URL: ${PURGE_DB_PASSWORD:+mysql://grc_purge:${PURGE_DB_PASSWORD}@mysql:3306/grc}
      APP_ORIGIN: ${APP_ORIGIN_OVERRIDE:-https://${DOMAIN}}
      APP_ENV: ${APP_ENV:-production}
      MFA_ENC_KEY: ${MFA_ENC_KEY:?set in .env}
      WEBHOOK_ENC_KEY: ${WEBHOOK_ENC_KEY:-}
      CSRF_KEY: ${CSRF_KEY:?set in .env}
      EVIDENCE_DIR: /data/evidence
      EVIDENCE_MAX_FILE_MB: ${EVIDENCE_MAX_FILE_MB:-25}
      EVIDENCE_DEFAULT_QUOTA_MB: ${EVIDENCE_DEFAULT_QUOTA_MB:-0}
      EVIDENCE_MIN_FREE_MB: ${EVIDENCE_MIN_FREE_MB:-1024}
      EVIDENCE_LINK_HOSTS: ${EVIDENCE_LINK_HOSTS:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      EVIDENCE_AUTO_SCAN: ${EVIDENCE_AUTO_SCAN:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes: [ "evidence_data:/data/evidence" ]
    healthcheck: { test: ["CMD","node","-e","fetch('http://127.0.0.1:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"], interval: 15s, timeout: 5s, retries: 5, start_period: 20s }
    deploy: { resources: { limits: { memory: 512m } } }
    logging: *logging
  worker:
    <<: [ *hardening, *readonly ]
    stop_grace_period: 60s
    build: { context: ., dockerfile: worker/Dockerfile }
    restart: unless-stopped
    depends_on: { init: { condition: service_completed_successfully } }
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      npm_config_update_notifier: "false"
      NODE_ENV: production
      WEBHOOK_ENC_KEY: ${WEBHOOK_ENC_KEY:-}
      DATABASE_URL: mysql://grc_worker:${WORKER_DB_PASSWORD}@mysql:3306/grc
      APP_ORIGIN: ${APP_ORIGIN_OVERRIDE:-https://${DOMAIN}}
      EVIDENCE_DIR: /data/evidence
      ALERT_MIN_FREE_MB: ${ALERT_MIN_FREE_MB:-2048}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
    volumes: [ "evidence_data:/data/evidence" ]
    deploy: { resources: { limits: { memory: 384m } } }
    logging: *logging
  # Optional malware scanner. Start with:  docker compose --profile scan up -d   and set CLAMAV_HOST=clamav:3310 in .env (see docs/EVIDENCE.md).
  clamav:
    profiles: [ "scan" ]
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
    volumes: [ "clamav_db:/var/lib/clamav" ]
    healthcheck: { test: ["CMD","clamdcheck.sh"], interval: 60s, timeout: 10s, retries: 5, start_period: 180s }
    deploy: { resources: { limits: { memory: 3g } } }
    logging: *logging
  web:
    <<: [ *hardening, *readonly ]
    cap_add: [ NET_BIND_SERVICE ]
    stop_grace_period: 15s
    build: { context: ./web }
    restart: unless-stopped
    depends_on: { api: { condition: service_healthy } }
    environment: { DOMAIN: "${DOMAIN:?set in .env}" }
    ports: [ "${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443" ]
    volumes: [ "caddy_data:/data", "caddy_config:/config" ]
    deploy: { resources: { limits: { memory: 128m } } }
    logging: *logging
volumes: { mysql_data: {}, caddy_data: {}, caddy_config: {}, evidence_data: {}, clamav_db: {} }
