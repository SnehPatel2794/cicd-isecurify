name: security-scan
# Secret scanning of the whole history and vulnerability scanning of the three container images. Neither can run in the author's sandbox: first run happens in GitHub.
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]     # weekly, so a newly published vulnerability in an unchanged image is still reported
permissions: { contents: read }
concurrency: { group: "scan-${{ github.ref }}", cancel-in-progress: true }
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: api/Dockerfile }
          - { name: worker, context: ., file: worker/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build -t grc-${{ matrix.name }}:scan -f ${{ matrix.file }} ${{ matrix.context }}
      - name: Trivy (fails on fixable HIGH or CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore --scanners vuln,secret grc-${{ matrix.name }}:scan
