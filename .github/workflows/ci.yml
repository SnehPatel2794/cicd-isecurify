name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env: { TEST_ADMIN_URL: "mysql://root:root@127.0.0.1:3306/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "*/package-lock.json" }
      - run: for d in api worker web; do (cd $d && npm ci && npm run typecheck); done
      - run: cd api && npm test
      - run: cd worker && npm test
      - run: cd web && npm test && npm run build
      - run: for d in api worker web; do (cd $d && npm audit --omit=dev --audit-level=high); done
  deploy-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: |
          for f in deploy/*.sh; do bash -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning -x deploy/*.sh || true
      - name: Compose file
        run: |
          printf 'DOMAIN=example.test\nMYSQL_ROOT_PASSWORD=x\nAPP_DB_PASSWORD=x\nWORKER_DB_PASSWORD=x\nMFA_ENC_KEY=x\nCSRF_KEY=x\n' > /tmp/ci.env
          docker compose --env-file /tmp/ci.env config -q
      - name: Caddyfile
        run: docker run --rm -e DOMAIN=example.test -v "$PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
  e2e:
    # Real browser, real API, real database: the main journey (e2e/journey.spec.ts). See docs/E2E.md
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env: { E2E_ADMIN_URL: "mysql://root:root@127.0.0.1:3306/" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "*/package-lock.json" }
      - run: cd api && npm ci
      - run: cd web && npm ci
      - run: cd e2e && npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: e2e-report, path: "e2e/playwright-report\ne2e/test-results", retention-days: 7 }
