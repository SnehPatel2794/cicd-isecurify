name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ADMIN_URL: "mysql://root:root@127.0.0.1:3306/"
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL
        run: |
          docker run -d --name mysql --network host \
            -e MYSQL_ROOT_PASSWORD=root \
            mysql:8.0 --log-bin-trust-function-creators=1
          for i in $(seq 1 60); do
            docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL did not start"
          docker logs mysql
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "*/package-lock.json"

      - name: Install dependencies
        run: |
          for d in api worker web; do
            (cd $d && npm ci)
          done

      - name: Typecheck
        run: |
          for d in api worker web; do
            (cd $d && npm run typecheck)
          done

      - name: API tests
        timeout-minutes: 8
        run: cd api && npm test

      - name: Worker tests
        timeout-minutes: 8
        run: cd worker && npm test

      - name: Web tests and build
        timeout-minutes: 8
        run: cd web && npm test && npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,    context: .,   file: api/Dockerfile }
          - { name: worker, context: .,   file: worker/Dockerfile }
          - { name: web,    context: web, file: web/Dockerfile }
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sneh2794/grc-${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
